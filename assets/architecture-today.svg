<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="915" viewBox="0 0 1240 915" font-family="Segoe UI, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture today: production on Google Cloud">
<title>Architecture today: production on Google Cloud</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0.5" y="0.5" width="1239" height="914" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32.0" y="50.0" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start">Architecture today</text>
<text x="32.0" y="80.0" font-size="16" font-weight="normal" fill="#64748B" text-anchor="start">Production on Google Cloud, running as a small, capped beta</text>
<rect x="32.0" y="103.0" width="34.0" height="19.0" rx="3" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="76.0" y="118.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Built: runs today</text>
<text x="232.1" y="118.0" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Everything shown is built. The MCP server is tested end to end and not yet deployed.</text>
<rect x="298" y="150" width="910" height="666.0" rx="10" fill="#FCFDFE" stroke="#94A3B8"/>
<text x="320.0" y="176.0" font-size="14" font-weight="600" fill="#64748B" text-anchor="start">Google Cloud: one project, all infrastructure in Terraform</text>
<rect x="32.0" y="190.0" width="216.0" height="56.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="213.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="middle">People</text>
<text x="140.0" y="234.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">Browser</text>
<rect x="32.0" y="282.5" width="216.0" height="75.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="306.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="middle">Web app</text>
<text x="140.0" y="326.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">React, TypeScript.</text>
<text x="140.0" y="345.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">Firebase Hosting</text>
<rect x="32.0" y="397.5" width="216.0" height="56.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="421.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="middle">AI assistants</text>
<text x="140.0" y="441.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">MCP clients</text>
<rect x="32.0" y="490.0" width="216.0" height="167.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="513.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">MCP server (C#, .NET)</text>
<text x="44.0" y="534.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Every result carries</text>
<text x="44.0" y="552.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">provenance and a trust</text>
<text x="44.0" y="571.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">class. stdio, or HTTP as</text>
<text x="44.0" y="589.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">an OAuth 2.1 resource</text>
<text x="44.0" y="608.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">server. Reaches the API</text>
<text x="44.0" y="626.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">with an exchanged token,</text>
<text x="44.0" y="645.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">four read-only endpoints</text>
<rect x="139.6" y="479.0" width="100.4" height="20" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
<text x="189.8" y="493.5" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">not deployed</text>
<rect x="32.0" y="697.5" width="216.0" height="186.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="721.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">GitHub Actions</text>
<text x="44.0" y="741.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">CI: tests, type checks,</text>
<text x="44.0" y="760.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">CodeQL, evaluation and</text>
<text x="44.0" y="778.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">tenant-isolation gates.</text>
<text x="44.0" y="797.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Deploy through Workload</text>
<text x="44.0" y="815.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Identity: Terraform</text>
<text x="44.0" y="834.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">apply, then migrations.</text>
<text x="44.0" y="852.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Weekly evaluation against</text>
<text x="44.0" y="871.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">the live models</text>
<rect x="320.0" y="190.0" width="492.0" height="404.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="332.0" y="220.0" font-size="16.5" font-weight="700" fill="#0F172A" text-anchor="start">API service: Cloud Run (Python, FastAPI)</text>
<rect x="332" y="238" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="264.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">Question router: SQL, retrieval or agent</text>
<rect x="332" y="288" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="314.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">Text-to-SQL, deterministic checks, read-only role</text>
<rect x="332" y="338" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="364.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">Hybrid retrieval: pgvector + trigram, rank fusion</text>
<rect x="332" y="388" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="414.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">Agent: tools, budgets, soft stop</text>
<rect x="332" y="438" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="464.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">Ingest: classify, extract, validate, reconcile, embed</text>
<rect x="332" y="488" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="514.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">One model adapter: the only code that calls the SDK</text>
<rect x="332" y="538" width="468" height="40" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="344.0" y="564.0" font-size="14.5" font-weight="normal" fill="#0F172A" text-anchor="start">Cost ledger, audit records, telemetry</text>
<rect x="838.0" y="190.0" width="348.0" height="75.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="850.0" y="213.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Vertex AI</text>
<text x="850.0" y="234.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Gemini models for extraction, questions and</text>
<text x="850.0" y="252.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">the agent. Text embeddings for search</text>
<line x1="812.0" y1="220.0" x2="838.0" y2="220.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="838.0" y="279.0" width="348.0" height="93.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="850.0" y="302.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud SQL: PostgreSQL</text>
<text x="850.0" y="323.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">pgvector with HNSW indexes, pg_trgm. Forced</text>
<text x="850.0" y="341.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">row-level security. Cache table.</text>
<text x="850.0" y="360.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Append-only cost ledger</text>
<line x1="812.0" y1="309.0" x2="838.0" y2="309.0" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="838.0" y="386.5" width="348.0" height="56.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="850.0" y="410.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Storage</text>
<text x="850.0" y="430.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Uploaded documents</text>
<line x1="812.0" y1="414.8" x2="838.0" y2="414.8" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="838.0" y="457.0" width="348.0" height="56.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="850.0" y="480.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Secret Manager</text>
<text x="850.0" y="501.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Keys and passwords</text>
<line x1="812.0" y1="485.2" x2="838.0" y2="485.2" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320.0" y="628.0" width="239.0" height="93.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="332.0" y="651.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Tasks</text>
<text x="332.0" y="672.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Extraction queue with</text>
<text x="332.0" y="690.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">retries</text>
<rect x="573.0" y="628.0" width="239.0" height="93.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="585.0" y="651.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Run jobs</text>
<text x="585.0" y="672.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Migrations. Nightly</text>
<text x="585.0" y="690.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">candidate cases from</text>
<text x="585.0" y="709.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">corrections</text>
<rect x="838.0" y="628.0" width="348.0" height="93.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="850.0" y="651.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Scheduler</text>
<text x="850.0" y="672.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Starts the nightly job</text>
<rect x="320.0" y="737.5" width="492.0" height="56.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="332.0" y="761.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Monitoring and Trace</text>
<text x="332.0" y="781.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">OpenTelemetry traces and metrics. Budget and health alerts</text>
<rect x="838.0" y="737.5" width="348.0" height="56.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="850.0" y="761.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Artifact Registry</text>
<text x="850.0" y="781.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Container images</text>
