<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Segoe UI, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture today: production on Google Cloud">
<title>Architecture today: production on Google Cloud</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0.5" y="0.5" width="1239" height="819" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Architecture today</text>
<text x="32.0" y="70.0" font-size="12.5" font-weight="normal" fill="#64748B" text-anchor="start">Production on Google Cloud, running as a small, capped beta</text>
<rect x="32.0" y="97.0" width="30.0" height="16.0" rx="3" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="70.0" y="109.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Built: runs today</text>
<text x="260.0" y="109.0" font-size="11.5" font-weight="normal" fill="#64748B" text-anchor="start">Everything shown is built. The MCP server is tested end to end and not yet deployed.</text>
<rect x="32.0" y="160.0" width="200.0" height="64.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="132.0" y="178.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">People</text>
<text x="132.0" y="195.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="middle">Browser</text>
<rect x="32.0" y="560.0" width="200.0" height="64.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="132.0" y="578.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">AI assistants</text>
<text x="132.0" y="595.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="middle">MCP clients</text>
<rect x="272.0" y="160.0" width="226.0" height="64.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="385.0" y="178.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Web app</text>
<text x="385.0" y="195.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="middle">React, TypeScript. Firebase</text>
<text x="385.0" y="210.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="middle">Hosting</text>
<rect x="272.0" y="504.0" width="226.0" height="148.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="282.0" y="522.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">MCP server (C#, .NET)</text>
<text x="282.0" y="539.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Every result carries provenance</text>
<text x="282.0" y="554.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">and a trust class. stdio, or HTTP</text>
<text x="282.0" y="569.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">as an OAuth 2.1 resource server.</text>
<text x="282.0" y="584.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Reaches the API with an exchanged</text>
<text x="282.0" y="599.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">token, four read-only endpoints</text>
<rect x="408.0" y="491.0" width="84.0" height="17" rx="8.5" fill="#FFFFFF" stroke="#334155" stroke-width="1"/>
<text x="450.0" y="503.5" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">not deployed</text>
<rect x="532" y="136" width="676" height="650" rx="10" fill="#FCFDFE" stroke="#94A3B8"/>
<text x="548.0" y="160.0" font-size="12" font-weight="600" fill="#64748B" text-anchor="start">Google Cloud: one project, all infrastructure in Terraform</text>
<rect x="556.0" y="176.0" width="382.0" height="392.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="568.0" y="198.0" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">API service: Cloud Run (Python, FastAPI)</text>
<rect x="568" y="214" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="238.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">Question router: SQL, retrieval or agent</text>
<rect x="568" y="262" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="286.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">Text-to-SQL, deterministic checks, read-only role</text>
<rect x="568" y="310" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="334.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">Hybrid retrieval: pgvector + trigram, rank fusion</text>
<rect x="568" y="358" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="382.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">Agent: tools, budgets, soft stop</text>
<rect x="568" y="406" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="430.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">Ingest: classify, extract, validate, reconcile, embed</text>
<rect x="568" y="454" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="478.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">One model adapter: the only code that calls the SDK</text>
<rect x="568" y="502" width="358" height="38" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="580.0" y="526.0" font-size="12" font-weight="normal" fill="#0F172A" text-anchor="start">Cost ledger, audit records, telemetry</text>
<rect x="966.0" y="176.0" width="218.0" height="112.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="976.0" y="194.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Vertex AI</text>
<text x="976.0" y="211.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Gemini models for extraction,</text>
<text x="976.0" y="226.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">questions and the agent. Text</text>
<text x="976.0" y="241.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">embeddings for search</text>
<rect x="966.0" y="306.0" width="218.0" height="118.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="976.0" y="324.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud SQL: PostgreSQL</text>
<text x="976.0" y="341.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">pgvector with HNSW indexes,</text>
<text x="976.0" y="356.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">pg_trgm. Forced row-level</text>
<text x="976.0" y="371.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">security. Cache table.</text>
<text x="976.0" y="386.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Append-only cost ledger</text>
<rect x="966.0" y="442.0" width="218.0" height="56.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="976.0" y="460.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Storage</text>
<text x="976.0" y="477.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Uploaded documents</text>
<rect x="966.0" y="516.0" width="218.0" height="52.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="976.0" y="534.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Secret Manager</text>
<text x="976.0" y="551.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Keys and passwords</text>
<rect x="556.0" y="596.0" width="186.0" height="72.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="566.0" y="614.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Tasks</text>
<text x="566.0" y="631.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Extraction queue with</text>
<text x="566.0" y="646.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">retries</text>
<rect x="752.0" y="596.0" width="186.0" height="72.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="762.0" y="614.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Run jobs</text>
<text x="762.0" y="631.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Migrations. Nightly</text>
<text x="762.0" y="646.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">candidate cases from</text>
<text x="762.0" y="661.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">corrections</text>
<rect x="966.0" y="596.0" width="218.0" height="72.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="976.0" y="614.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Scheduler</text>
<text x="976.0" y="631.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Starts the nightly job</text>
<rect x="556.0" y="690.0" width="382.0" height="72.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="566.0" y="708.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Cloud Monitoring and Trace</text>
<text x="566.0" y="725.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">OpenTelemetry traces and metrics. Budget and health alerts</text>
<rect x="966.0" y="690.0" width="218.0" height="72.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="976.0" y="708.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Artifact Registry</text>
<text x="976.0" y="725.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Container images</text>
<rect x="32.0" y="690.0" width="448.0" height="96.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.4"/>
<text x="42.0" y="708.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">GitHub Actions</text>
<text x="42.0" y="725.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">CI: tests, type checks, CodeQL, evaluation and tenant-isolation gates.</text>
<text x="42.0" y="740.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Deploy through Workload Identity: Terraform apply, then migrations.</text>
<text x="42.0" y="755.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Weekly evaluation against the live models</text>
