<text x="32.0" y="46.0" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">Architecture at scale</text>
<text x="32.0" y="70.0" font-size="12.5" font-weight="normal" fill="#64748B" text-anchor="start">The same platform designed for 1 million users and 10 million documents a year. Each addition names the trigger that would justify it</text>
