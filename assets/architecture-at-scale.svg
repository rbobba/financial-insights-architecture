<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1164" viewBox="0 0 1240 1164" font-family="Segoe UI, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture at scale: what is added, and when">
<title>Architecture at scale: what is added, and when</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0.5" y="0.5" width="1239" height="1163" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="32.0" y="50.0" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start">Architecture at scale</text>
<text x="32.0" y="80.0" font-size="16" font-weight="normal" fill="#64748B" text-anchor="start">The same platform designed for enterprise volume. Each addition names the condition that justifies it</text>
<rect x="32.0" y="103.0" width="34.0" height="19.0" rx="3" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="76.0" y="118.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Built: runs today</text>
<rect x="232.1" y="103.0" width="34.0" height="19.0" rx="3" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="276.1" y="118.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Next: designed, not built</text>
<rect x="491.6" y="103.0" width="34.0" height="19.0" rx="3" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="535.6" y="118.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">At scale: added when its trigger is reached</text>
<rect x="32" y="136" width="1176" height="60.0" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="46.0" y="158.5" font-size="14.5" font-weight="normal" fill="#334155" text-anchor="start">Design assumptions: 1 million users, 10 million documents a year, a 10x tax-season peak (about 270,000 documents a day, roughly 3 a second). Not</text>
<text x="46.0" y="177.5" font-size="14.5" font-weight="normal" fill="#334155" text-anchor="start">load-tested.</text>
<text x="32.0" y="242.0" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Edge and identity</text>
<rect x="32.0" y="252.0" width="382.7" height="96.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="275.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Web app</text>
<text x="44.0" y="296.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Firebase Hosting</text>
<rect x="428.7" y="252.0" width="382.7" height="96.0" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="440.7" y="275.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Load balancer, web application firewall,</text>
<text x="440.7" y="295.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">CDN</text>
<text x="440.7" y="316.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Cloud Load Balancing, Cloud Armor, Cloud CDN</text>
<text x="440.7" y="335.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: the beta opens to the public</text>
<rect x="825.3" y="252.0" width="382.7" height="96.0" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="837.3" y="275.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Shared sessions and rate limits</text>
<text x="837.3" y="296.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Memorystore</text>
<text x="837.3" y="315.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: a public launch, or more than one region</text>
<text x="32.0" y="386.0" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Services</text>
<rect x="32.0" y="396.0" width="283.5" height="112.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="419.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Question services</text>
<text x="44.0" y="440.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Text-to-SQL, retrieval, agent</text>
<rect x="329.5" y="396.0" width="283.5" height="112.0" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="341.5" y="419.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">API across regions, autoscaled</text>
<text x="341.5" y="440.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Cloud Run</text>
<text x="341.5" y="459.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: the availability target needs</text>
<text x="341.5" y="477.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">more than one region</text>
<rect x="627.0" y="396.0" width="283.5" height="112.0" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="639.0" y="419.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Model gateway</text>
<text x="639.0" y="440.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Routing, quotas, caching, failover</text>
<text x="639.0" y="458.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">to a second region or provider</text>
<text x="639.0" y="478.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: a second provider, or quota</text>
<text x="639.0" y="495.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">limits at peak</text>
<rect x="924.5" y="396.0" width="283.5" height="112.0" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="936.5" y="419.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Policy checks and audit on</text>
<text x="936.5" y="439.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">every model call</text>
<text x="32.0" y="546.0" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Ingestion</text>
<rect x="32.0" y="556.0" width="224.0" height="93.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="579.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Upload</text>
<text x="44.0" y="600.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Cloud Storage</text>
<rect x="270.0" y="556.0" width="224.0" height="93.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="282.0" y="579.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Per-tenant fair queues</text>
<text x="282.0" y="599.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: one tenant&#x27;s upload</text>
<text x="282.0" y="616.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">delays others</text>
<rect x="508.0" y="556.0" width="224.0" height="93.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="520.0" y="579.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Extraction workers</text>
<text x="520.0" y="600.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Batched model calls</text>
<text x="520.0" y="619.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: tax-season peak, about</text>
<text x="520.0" y="637.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">3 documents a second</text>
<rect x="746.0" y="556.0" width="224.0" height="93.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="758.0" y="579.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Validation and</text>
<text x="758.0" y="599.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">reconciliation</text>
<text x="758.0" y="620.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Idempotent steps</text>
<rect x="984.0" y="556.0" width="224.0" height="93.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="996.0" y="579.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Dead-letter queue and</text>
<text x="996.0" y="599.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">replay</text>
<text x="996.0" y="619.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: failures need triage at</text>
<text x="996.0" y="636.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">volume</text>
<line x1="257.0" y1="602.8" x2="269.0" y2="602.8" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="495.0" y1="602.8" x2="507.0" y2="602.8" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="733.0" y1="602.8" x2="745.0" y2="602.8" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="971.0" y1="602.8" x2="983.0" y2="602.8" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="32.0" y="687.5" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Events and analytics</text>
<rect x="32.0" y="697.5" width="382.7" height="93.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="44.0" y="721.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Event stream for other consumers</text>
<text x="44.0" y="741.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Pub/Sub</text>
<text x="44.0" y="761.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: over 10,000 events a day, or several consuming</text>
<text x="44.0" y="778.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">teams</text>
<rect x="428.7" y="697.5" width="382.7" height="93.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="440.7" y="721.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Warehouse with governed metric definitions</text>
<text x="440.7" y="741.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">BigQuery</text>
<text x="440.7" y="761.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: analytical questions slow the operational</text>
<text x="440.7" y="778.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">database</text>
<rect x="825.3" y="697.5" width="382.7" height="93.5" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="837.3" y="721.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Forecasting and anomaly detection</text>
<text x="32.0" y="829.0" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Data</text>
<rect x="32.0" y="839.0" width="283.5" height="113.5" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="862.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">PostgreSQL</text>
<text x="44.0" y="883.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">pgvector with HNSW indexes, forced</text>
<text x="44.0" y="901.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">row-level security</text>
<rect x="329.5" y="839.0" width="283.5" height="113.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="341.5" y="862.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Pooler, read replicas,</text>
<text x="341.5" y="882.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">partitions by tenant and time</text>
<text x="341.5" y="903.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Cloud SQL or AlloyDB</text>
<text x="341.5" y="922.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: connection limits, or questions</text>
<text x="341.5" y="940.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">slowing writes</text>
<rect x="627.0" y="839.0" width="283.5" height="113.5" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="639.0" y="862.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Dedicated vector search</text>
<text x="639.0" y="883.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Vertex AI Vector Search</text>
<text x="639.0" y="902.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: filtered vector search misses</text>
<text x="639.0" y="920.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">latency or recall targets</text>
<rect x="924.5" y="839.0" width="283.5" height="113.5" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="936.5" y="862.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Envelope encryption with</text>
<text x="936.5" y="882.5" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">per-tenant keys</text>
<text x="936.5" y="903.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Cloud KMS</text>
<text x="32.0" y="990.5" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start">Trust and operations</text>
<rect x="32.0" y="1000.5" width="224.0" height="132.0" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
<text x="44.0" y="1024.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Evaluation gates</text>
<text x="44.0" y="1044.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">In CI, plus a weekly run</text>
<text x="44.0" y="1063.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">against the live models</text>
<rect x="270.0" y="1000.5" width="224.0" height="132.0" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="282.0" y="1024.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">LLM judge with rubrics</text>
<text x="282.0" y="1044.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Faithfulness and</text>
<text x="282.0" y="1063.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">completeness</text>
<rect x="508.0" y="1000.5" width="224.0" height="132.0" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="520.0" y="1024.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Citations from each</text>
<text x="520.0" y="1044.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">figure to its source</text>
<text x="520.0" y="1064.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">page</text>
<rect x="746.0" y="1000.5" width="224.0" height="132.0" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="758.0" y="1024.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Online evaluation and</text>
<text x="758.0" y="1044.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">drift alerts</text>
<text x="758.0" y="1064.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">On sampled production</text>
<text x="758.0" y="1083.0" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">traffic</text>
<text x="758.0" y="1102.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: real traffic exists to</text>
<text x="758.0" y="1120.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">sample</text>
<rect x="984.0" y="1000.5" width="224.0" height="132.0" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2.4" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<text x="996.0" y="1024.0" font-size="15.5" font-weight="600" fill="#0F172A" text-anchor="start">Service-level objectives</text>
<text x="996.0" y="1044.5" font-size="14" font-weight="normal" fill="#334155" text-anchor="start">Error budgets, runbooks</text>
<text x="996.0" y="1064.0" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">When: people depend on it</text>
<text x="996.0" y="1081.5" font-size="13" font-weight="normal" fill="#64748B" text-anchor="start" font-style="italic">daily</text>
