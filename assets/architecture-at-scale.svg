<text x="458.0" y="109.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">At scale: added when its trigger is reached</text>
<rect x="32" y="126" width="1336" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="46.0" y="153.0" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">Design assumptions: 1 million users, 10 million documents a year, a 10x tax-season peak (about 270,000 documents a day, roughly 3 a second). Not load-tested.</text>
